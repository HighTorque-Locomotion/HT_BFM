[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "motivo-isaac"
version = "0.1.0"
description = "Standalone Pi12 flat-ground AMP training, playback and export"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.15",
    "torch>=2.7",
    "mujoco>=3.3",
    "PyYAML>=6",
    "GitPython>=3.1",
    "tensorboard>=2.18",
    "onnx>=1.16",
    "onnxruntime>=1.22",
]

# Install Isaac Lab and Isaac Sim separately using the existing HT_BFM environment.
# Their local editable installations must not be replaced by a PyPI resolver.
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9.6"]
wandb = ["wandb"]
neptune = ["neptune"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"humanoidverse.flat_amp" = [
    "_vendor/LICENSE.*",
    "_vendor/source_manifest.json",
    "_vendor/legged_lab/envs/pi/datasets/**/*.npz",
    "_vendor/legged_lab/envs/pi/datasets/**/*.yaml",
    "_vendor/legged_lab/envs/pi/datasets/**/manifest.json",
]

[tool.setuptools.packages.find]
include = ["humanoidverse", "humanoidverse.flat_amp*"]

[tool.ruff]
line-length = 140
extend-exclude = ["wandb", "humanoidverse/flat_amp/_vendor"]

[tool.ruff.lint]
ignore = ["E402", "E731"]
extend-select = ["I"]
