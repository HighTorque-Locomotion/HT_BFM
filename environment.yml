name: HT_BFM
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - setuptools<81
  - pip:
      - --extra-index-url https://pypi.nvidia.com/
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - -e ../IsaacLab2.3/IsaacLab/source/isaaclab
      - -e ../IsaacLab2.3/IsaacLab/source/isaaclab_rl
      - isaacsim[all,extscache]==5.1.0.0; sys_platform == 'linux'
      - torch==2.7.0+cu128
      - numpy==1.26.0
      - scipy==1.15.3
      - mujoco==3.8.1
      - PyYAML>=6
      - GitPython>=3.1
      - tensorboard>=2.18
      - onnx==1.20.1
      - onnxruntime==1.26.0
      - pytest>=8
      - ruff>=0.9.6
