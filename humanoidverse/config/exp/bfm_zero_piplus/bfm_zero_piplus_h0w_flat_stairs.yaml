# @package _global_

defaults:
  - bfm_zero_piplus
  - override /robot: piplus/PiPlus_S_12L8A0G2H0W
  - override /terrain: terrain_piplus_h0w_flat_stairs
  - _self_

exp_var: piplus_h0w_flat_stairs
project_name: BFMZeroPiPlusH0WFlatStairs

robot:
  motion:
    motion_file: dataset/PiPlus_S_12L8A0G2H0W_lafan_dataset_20260629/piplus_h0w_flat_stairs_bfm.pkl

env:
  config:
    # Order and proportions must match terrain.terrain_types/proportions. These
    # prefixes are generated by build_piplus_h0w_flat_stairs_bfm.py.
    motion_terrain_groups:
      - {name: flat, motion_prefix: "flat__", proportion: 0.4}
      - {name: stairs_0, motion_prefix: "stairs_0__", proportion: 0.1}
      - {name: stairs_1, motion_prefix: "stairs_1__", proportion: 0.1}
      - {name: stairs_2, motion_prefix: "stairs_2__", proportion: 0.1}
      - {name: stairs_3, motion_prefix: "stairs_3__", proportion: 0.1}
      - {name: stairs_4, motion_prefix: "stairs_4__", proportion: 0.1}
      - {name: stairs_5, motion_prefix: "stairs_5__", proportion: 0.1}
    resample_motion_when_training: false
    lie_down_init: false
    lie_down_init_prob: 0.0

domain_rand:
  # First make the motion/terrain pairing converge; re-enable strong pushes in a
  # later robustness phase.
  push_robots: false
